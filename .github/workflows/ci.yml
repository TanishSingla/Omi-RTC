# Runs on every pull request into main (and on main itself after a merge).
# Branch protection on main requires the "test" job below to pass before merging.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test # the status check name branch protection looks for; rename both together
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - install
        run: npm ci --prefix server
      - name: Server - tests (matchmaker, rooms, filter, socket e2e)
        run: npm test --prefix server

      - name: Client - install
        run: npm ci --prefix client
      - name: Client - lint
        run: npm run lint --prefix client
      - name: Client - typecheck + build
        run: npm run build --prefix client
